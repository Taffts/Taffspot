  <!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taffeta Event Rentals</title>

<style>
body{margin:0;font-family:Arial;background:#f8f6f6;color:#333}
.topbar{background:#9b1c1c;color:#fff;padding:8px;text-align:center}
nav{display:flex;justify-content:space-between;padding:15px;background:#fff}
.hero{background:#9b1c1c;color:#fff;padding:80px;text-align:center}
.section{padding:40px;text-align:center}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:15px}
.card{background:#fff;padding:20px;border-radius:10px}
footer{background:#9b1c1c;color:#fff;text-align:center;padding:20px}
input,select,textarea{width:100%;padding:10px;margin:5px 0}
button{background:#9b1c1c;color:#fff;padding:10px;border:none}
</style>

</head>

<body>

<div class="topbar">Taffeta Event Rentals</div>

<nav>
<h2>TER</h2>
<div>
Home | Services | 360 Booth | Shop
</div>
</nav>

<section class="hero">
<h1>Elegant Events & 360 Experiences</h1>
<p>Book your unforgettable moment today</p>
</section>

<section class="section">
<h2>360 Photo Booth Packages</h2>
<div class="grid">
<div class="card">Silver - $299</div>
<div class="card">Gold - $449</div>
<div class="card">Platinum - $699</div>
</div>
</section>

<section class="section">
<h2>Book Now</h2>

<form action="https://formspree.io/f/mvzlwpaw" method="POST">
<input type="text" name="name" placeholder="Full Name" required>
<input type="email" name="email" placeholder="Email" required>
<input type="date" name="date" required>

<select name="package">
<option>Silver</option>
<option>Gold</option>
<option>Platinum</option>
</select>

<textarea name="message" placeholder="Event details"></textarea>

<button type="submit">Request Booking</button>

</form>

</section>

<footer>
© 2026 Taffeta Event Rentals
</footer>

</body>
</html>
    
  </body>
  
</html>
